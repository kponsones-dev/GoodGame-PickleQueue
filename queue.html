<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickleQueue - Matchmaking Queue</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Stylesheets: Global First, then Page-Specific -->
  <link href="css/style.css" rel="stylesheet">
  <link href="css/queue.css" rel="stylesheet">
</head>
<body>

  <!-- Main Content Card (Wrapped dynamically by js/layout.js) -->
  <div class="row g-4">
    
    <!-- Session Overview Header Card -->
    <div class="col-12">
      <div class="card shadow-sm bg-white border-0">
        <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <div>
            <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-2 py-1 mb-2">Active Session</span>
            <h2 id="sessionTitleDisplay" class="h4 fw-bold text-dark mb-1">Loading Session...</h2>
            <p class="text-muted small mb-0">Manage players, active queue pool, and generate automated or manual matches.</p>
          </div>
          <div>
            <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" onclick="endCurrentSession()">
              <i class="bi bi-stop-circle-fill"></i> End Session
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Left Column: Current Session Roster / Pool -->
    <div class="col-lg-5">
      <div class="card shadow-sm h-100 bg-white border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
          <h5 class="fw-bold m-0 text-dark d-flex align-items-center gap-2">
            <i class="bi bi-people-fill text-primary"></i> Session Players Pool
          </h5>
          <span id="queuePlayerCountBadge" class="badge bg-primary rounded-pill">0 Players</span>
        </div>
        <div class="card-body">
          <div id="queueRosterContainer" class="d-flex flex-wrap gap-2">
            <span class="text-muted small italic w-100 text-center py-4">Loading active session players...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Matchmaking Controls & Generated Matches -->
    <div class="col-lg-7">
      <div class="card shadow-sm h-100 bg-white border-0">
        <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
          <h5 class="fw-bold m-0 text-dark d-flex align-items-center gap-2">
            <i class="bi bi-shuffle text-success"></i> Match Generation
          </h5>
          <button class="btn btn-success btn-sm d-flex align-items-center gap-1" onclick="generateMatches()">
            <i class="bi bi-lightning-charge-fill"></i> Generate Matches
          </button>
        </div>
        <div class="card-body">
          <div id="matchesResultContainer" class="text-center py-5 text-muted">
            <i class="bi bi-diagram-3 fs-1 text-secondary opacity-50 mb-2 d-block"></i>
            <p class="mb-1 fw-semibold">No matches generated yet.</p>
            <p class="small text-muted">Click "Generate Matches" to create balanced matchups from the queue pool.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App JS Files -->
  <script src="js/layout.js"></script>
  <script src="js/db.js"></script>
  <script src="js/queue.js"></script>
</body>
</html>
